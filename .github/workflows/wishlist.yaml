---
name: Build and push docker image
on:
  push:
    branches: [ deploy ]
  workflow_dispatch:
jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Prepare image metadata
        id: meta
        run: |
          set -eo pipefail
          repo="${{ github.repository }}"
          project="${repo#*/}"
          project=$(echo "$project" | tr '[:upper:]' '[:lower:]')
          owner="${{ github.repository_owner }}"
          owner=$(echo "$owner" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${project}"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "REGISTRY_OWNER=$owner" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull base image (warm cache)
        run: docker pull node:20-alpine

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: microk8s-pve-runner
    # if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wishlist.kotobars.ru
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Create Image Pull Secret
        run: |
          kubectl create namespace todo --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.REGISTRY_PAT }} \
            --namespace wishlist \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: |
          set -eo pipefail
          kubectl create namespace todo --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml --namespace wishlist
          kubectl apply -f k8s/service.yaml --namespace wishlist
          kubectl apply -f k8s/httproute.yaml --namespace wishlist
          kubectl set image deployment/todo-frontend todo-frontend=${{ needs.build.outputs.image_name }}:${{ github.sha }} --namespace wishlist
          kubectl rollout status deployment/todo-frontend --namespace wishlist --timeout=120s
